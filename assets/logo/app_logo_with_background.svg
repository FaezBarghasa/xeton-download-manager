<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#130D24"/>
    </linearGradient>

    <!-- Outer Rim Neon Border -->
    <linearGradient id="rim_grad" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Cyan Acceleration Vector -->
    <linearGradient id="cyan_stream" x1="120" y1="100" x2="280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Magenta / Violet Vector -->
    <linearGradient id="magenta_stream" x1="392" y1="100" x2="232" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Central Download Core Dart -->
    <linearGradient id="core_dart" x1="256" y1="150" x2="256" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Bottom Speed Wings -->
    <linearGradient id="wing_left" x1="100" y1="280" x2="220" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="wing_right" x1="412" y1="280" x2="292" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="core_glow" x="140" y="80" width="232" height="350" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Radial Center Halo -->
    <radialGradient id="center_halo" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg_grad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="url(#rim_grad)" stroke-width="5" stroke-opacity="0.85"/>

  <!-- Radial Cybernetic Halo -->
  <circle cx="256" cy="256" r="190" fill="url(#center_halo)"/>

  <!-- Background Tech Orbit Lines -->
  <circle cx="256" cy="256" r="170" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="130" stroke="#C084FC" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 10"/>

  <!-- Left Upper X-Arm -->
  <path d="M124 120 C124 114, 130 110, 136 112 L206 136 C214 139, 219 146, 222 154 L256 244 L212 284 L142 168 C138 162, 134 152, 128 142 Z"
        fill="url(#cyan_stream)"/>

  <!-- Right Upper X-Arm -->
  <path d="M388 120 C388 114, 382 110, 376 112 L306 136 C298 139, 293 146, 290 154 L256 244 L300 284 L370 168 C374 162, 378 152, 384 142 Z"
        fill="url(#magenta_stream)"/>

  <!-- Lower Left Speed Wing -->
  <path d="M136 324 L204 364 C212 369, 218 377, 220 386 L226 410 C228 418, 220 424, 212 420 L148 376 C138 369, 132 358, 132 346 L134 330 C134 324, 140 320, 146 324 Z"
        fill="url(#wing_left)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Lower Right Speed Wing -->
  <path d="M376 324 L308 364 C300 369, 294 377, 292 386 L286 410 C284 418, 292 424, 300 420 L364 376 C374 369, 380 358, 380 346 L378 330 C378 324, 372 320, 366 324 Z"
        fill="url(#wing_right)" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Center Convergence Chevron & Downward Accelerator Dart -->
  <g filter="url(#core_glow)">
    <!-- Main Arrowhead / Dart Core -->
    <path d="M256 168 L320 252 C324 257, 321 264, 314 264 L284 264 L284 320 C284 324, 280 328, 276 328 L236 328 C232 328, 228 324, 228 320 L228 264 L198 264 C191 264, 188 257, 192 252 Z"
          fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Dynamic Super-Sonic Downward Dart -->
    <path d="M256 188 L302 248 L272 248 L272 312 L240 312 L240 248 L210 248 Z"
          fill="url(#core_dart)"/>

    <!-- Sharp Needle Tip Extension -->
    <path d="M256 296 L272 312 L256 392 L240 312 Z"
          fill="url(#core_dart)"/>
    
    <!-- Central Energy Diamond -->
    <polygon points="256,210 270,234 256,252 242,234" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Accent Energy Sparks / Particles -->
  <circle cx="256" cy="414" r="3.5" fill="#38BDF8"/>
  <circle cx="256" cy="428" r="2" fill="#38BDF8" opacity="0.6"/>
  <circle cx="216" cy="180" r="2.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="296" cy="180" r="2.5" fill="#F472B6" opacity="0.8"/>
</svg>
